<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnibus: symulator ceny</title>
<style>
:root{--p:#1f1e1b;--s:#5f5e5a;--t:#888780;--b:#d3d1c7;--accent-bg:#e6f1fb;--accent:#185fa5;
--danger:#a32d2d;--danger-bg:#fcebeb;--danger-b:#f09595;--ok:#3b6d11;--ok-bg:#eaf3de;--ok-b:#97c459;--surface:#f6f5f0}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--p);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.lead{color:var(--s);margin:0 0 16px;font-size:14px}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.sc button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--b);background:#fff;color:var(--p);cursor:pointer}
.sc button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
svg text{font-family:inherit}
.ts{font-size:12px;fill:var(--s)}.th{font-size:14px;font-weight:600;fill:var(--p)}
.row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--s)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.card{border-radius:12px;padding:12px 14px;border:1px solid var(--b)}
.pill{font-size:13px;padding:2px 6px;border-radius:6px;margin-left:6px}
#note{font-size:13px;color:var(--s);margin-top:10px}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Omnibus: jak ma się pokazywać cena</h1>
<p class="lead">Wybierz sytuację i przesuń suwak dnia. Lewa karta pokazuje, co sklep wyświetla dziś, prawa, co ma wyświetlać. Zielone okno to 30 dni, z których liczymy najniższą cenę.</p>
<div class="sc" id="sc"></div>
<svg id="ch" width="100%" viewBox="0 0 680 210" role="img" aria-label="Historia ceny i okna 30 dni"></svg>
<div class="row"><span>Dzień</span><input id="sl" type="range" min="31" max="75" value="45" style="flex:1"><span id="dl" style="min-width:150px;text-align:right"></span></div>
<div class="cards"><div class="card" id="cw"></div><div class="card" id="cr"></div></div>
<div id="note"></div>
</main>
<script>
const S=[
{n:'Długa promocja',f:d=>d<30?1009:719,k:d=>1089,t:'Jedna obniżka, która trwa ponad 30 dni. Przesuń suwak za dzień 60.'},
{n:'Druga obniżka',f:d=>d<30?2000:d<40?1600:1200,k:d=>2200,t:'Druga obniżka liczy się od nowa, od ceny z pierwszej promocji.'},
{n:'Zmiana ceny katalogowej',f:d=>d<30?1009:719,k:d=>d<45?1089:1199,t:'Od dnia 45 zmienia się tylko cena katalogowa. Cena sprzedaży stoi.'},
{n:'Cena wraca w górę',f:d=>d<30?1000:d<45?700:850,k:d=>1100,t:'Od dnia 45 cena rośnie z 700 do 850 zł. W ostatnich 30 dniach było taniej, więc to nie jest obniżka.'}];
const q=new URLSearchParams(location.search);
let cur=Math.min(3,Math.max(0,+q.get('s')||0));
const sc=document.getElementById('sc'),sl=document.getElementById('sl'),ch=document.getElementById('ch'),
dl=document.getElementById('dl'),cw=document.getElementById('cw'),cr=document.getElementById('cr'),note=document.getElementById('note');
if(q.get('d'))sl.value=q.get('d');
const X=d=>50+d*580/75, pl=v=>v.toLocaleString('pl-PL')+' zł';
function start(s,d){let a=d;while(a>0&&s.f(a-1)===s.f(d))a--;return a}
function minR(s,a,b){let m=Infinity;for(let i=Math.max(0,a);i<=b;i++)m=Math.min(m,s.f(i));return m}
function calc(s,d){const p=s.f(d),st=start(s,d);return {p,st,kat:s.k(d),ok:minR(s,st-30,st-1),
 wr:st-1>=d-30?minR(s,d-30,st-1):p,katChange:s.k(d)!==s.k(st)}}
function card(el,ttl,c,p,cross,om,pct,extra){
 el.style.borderColor=`var(--${c}-b)`;
 el.innerHTML=`<div style="font-size:13px;color:var(--${c});margin-bottom:6px">${ttl}</div>
 <div style="font-size:22px;font-weight:600">${pl(p)}${cross?` <span style="font-size:14px;font-weight:400;color:var(--s);text-decoration:line-through">${pl(cross)}</span>`:''}${pct!=null?`<span class="pill" style="background:var(--${c}-bg);color:var(--${c})">-${pct}%</span>`:''}</div>
 <div style="font-size:13px;color:var(--s);margin-top:6px;min-height:20px">${om?'Najniższa cena z 30 dni przed obniżką: '+pl(om):'&nbsp;'}</div>
 <div style="font-size:12px;color:var(--${c});margin-top:6px">${extra}</div>`}
function draw(){
 const s=S[cur],d=+sl.value,r=calc(s,d);
 let lo=Infinity,hi=0;for(let i=0;i<=75;i++){lo=Math.min(lo,s.f(i));hi=Math.max(hi,s.f(i),s.k(i))}
 const Y=v=>30+(hi-v)/(hi-lo)*80;
 let path='M'+X(0)+' '+Y(s.f(0)),kp='M'+X(0)+' '+Y(s.k(0));
 for(let i=1;i<=75;i++){path+=` L${X(i)} ${Y(s.f(i-1))} L${X(i)} ${Y(s.f(i))}`;kp+=` L${X(i)} ${Y(s.k(i-1))} L${X(i)} ${Y(s.k(i))}`}
 const okA=r.st-30,okB=r.st,wA=d-30,wB=d;
 ch.innerHTML=`<path d="${kp}" fill="none" stroke="var(--t)" stroke-width="1" stroke-dasharray="4 4"/>
 <text class="ts" x="${X(1)}" y="${Y(s.k(0))-6}">cena katalogowa</text>
 <path d="${path}" fill="none" stroke="#534AB7" stroke-width="2"/>
 <text class="ts" x="${X(1)}" y="${Y(s.f(0))+16}" style="fill:#3C3489">cena sprzedaży</text>
 <line x1="${X(d)}" y1="20" x2="${X(d)}" y2="128" stroke="var(--p)" stroke-width="1"/>
 <text class="th" x="${X(d)}" y="16" text-anchor="middle">dziś</text>
 <rect x="${X(okA)}" y="140" width="${X(okB)-X(okA)}" height="22" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
 <text class="ts" x="${X(okA)+6}" y="155" style="fill:#27500A">ma być: 30 dni przed obniżką</text>
 <rect x="${X(wA)}" y="170" width="${X(wB)-X(wA)}" height="22" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
 <text class="ts" x="${X(wA)+6}" y="185" style="fill:#791F1F">dziś: 30 dni przed dzisiaj</text>`;
 dl.textContent='dzień '+d+' ('+(d-r.st)+' dni obecnej ceny)';
 card(cw,'Dziś na karcie','danger',r.p,r.kat,r.katChange?null:r.wr,Math.round(100*(1-r.p/r.kat)),
  r.katChange?'cena z 30 dni znikła, plakietka została':(r.wr===r.p?'najniższa cena równa cenie promocyjnej':'procent liczony od ceny katalogowej'));
 const real=r.p<r.ok;
 card(cr,'Ma być','ok',r.p,real?r.ok:null,real?r.ok:null,real?Math.round(100*(1-r.p/r.ok)):null,
  real?'przekreślona najniższa cena z 30 dni, procent od niej':'bez przekreślenia i bez plakietki: to nie jest obniżka');
 note.textContent=s.t}
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.onclick=()=>{cur=i;[...sc.children].forEach((c,j)=>c.classList.toggle('on',j===i));draw()};sc.appendChild(b)});
sc.children[cur].classList.add('on');sl.oninput=draw;draw();
</script>
</body>
</html>
